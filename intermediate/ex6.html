    <main>
        <article>
            <h2>Описание задачи</h2>
            <p>Размещение бейджа поверх угла карточки с помощью position: relative и absolute.</p>
            <h2>Результат</h2>
            <div class="demo-box">
                <div style="position: relative; padding: 20px; border: 1px solid var(--border-color); width: 200px;">
                    <span style="position: absolute; top: -10px; right: -10px; background: red; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px;">NEW</span>
                    <p>Товар со статусом</p>
                </div>
            </div>
        </article>
