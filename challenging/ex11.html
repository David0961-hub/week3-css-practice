<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 11 — Challenging</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Упражнение 11: CSS Grid Layout</h1>
        <nav><a href="../index.html">← На главную</a></nav>
    </header>
    <main>
        <article>
            <h2>Описание задачи</h2>
            <p>Создание классической двухмерной сетки макета страницы на CSS Grid.</p>
            <h2>Результат</h2>
            <div class="demo-box">
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                    <div style="background: var(--border-color); padding: 10px;">Sidebar</div>
                    <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px;">Main Content</div>
                </div>
            </div>
        </article>
    </main>
    <footer><p>&copy; 2026 David Yuhta</p></footer>
</body>
</html>
